name: ci

# Lint + format + eval — fast, no system build. Eval instantiates every config
# through the module system, so a renamed package or invalid option fails here.
# The full mac/linux config builds (checks.*.darwin / .home) are deliberately
# left to local `make check`; building a whole nix-darwin system in CI is
# overkill for now.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: lint  ·  deadnix · statix · shellcheck
        run: nix build -L --no-link .#checks.x86_64-linux.lint
      - name: fmt   ·  nixfmt --check
        run: nix build -L --no-link .#checks.x86_64-linux.fmt
      - name: eval  ·  darwin + home + server configs
        run: |
          user="$(nix eval --raw --file username.nix)"
          nix eval --raw .#darwinConfigurations.mac.system.drvPath
          nix eval --raw .#homeConfigurations."$user".activationPackage.drvPath
          nix eval --raw .#homeConfigurations."$user-aarch64".activationPackage.drvPath
          # Headless profile (home/server.nix) — the account is the flake's
          # serverUser, not username.nix; -aarch64 is what the Hetzner cax11 uses.
          server="$(nix eval --raw .#homeConfigurations --apply \
            'c: builtins.head (builtins.filter (n: builtins.match ".*-server" n != null) (builtins.attrNames c))')"
          nix eval --raw .#homeConfigurations."$server".activationPackage.drvPath
          nix eval --raw .#homeConfigurations."$server-aarch64".activationPackage.drvPath
