# tmux — keybindings + status. Structural options + plugins are wired in
# home/tmux.nix (prefix=C-b, vi keys, mouse, resurrect/continuum, navigator).
# Edit this file for binds and looks; reload live with `prefix r`.

# ── second prefix: Ctrl+' ────────────────────────────────────────────────────
# Ctrl+' is not a normal terminal key (apostrophe carries no control code), so it
# only reaches tmux when extended keys (CSI-u) are enabled AND the outer terminal
# reports it. WezTerm supports extended keys; test with: press Ctrl+' — the PREFIX
# badge in the status bar should light up. If it doesn't, the terminal isn't
# sending it (swap prefix2 for a control key like C-Space).
set -s extended-keys on
set -s extended-keys-format csi-u # report modified keys to apps in the modern, unambiguous CSI-u form (vs legacy xterm)
set -as terminal-features "xterm*:extkeys"
set -g prefix2 "C-'"

# ── modern defaults ──────────────────────────────────────────────────────────
set -as terminal-features "*:RGB" # truecolor (modern idiom — same mechanism as extkeys above)
setw -g pane-scrollbars on # 3.6: per-pane scrollbar in the scrollback (handy with the mouse)
# tmux supports mode 2031 (auto dark/light theme → apps inside tmux): automatic,
# no option. Inert until WezTerm emits CSI 2031 (wezterm#6454, PR #7723 open), so
# theme switching rides the bg-colour path meanwhile: apps query OSC 11 at start
# (verified through tmux), which means only NEW processes pick up an OS flip.
set -s set-clipboard on # apps inside tmux set the system clipboard (OSC52 — works over ssh)
# One session per WezTerm tab: killing a session should close its tab, not park
# the client on a session another tab already shows (two clients on one session
# makes tmux shrink both to the smaller one). `off` did exactly that.
set -g detach-on-destroy on
set -g renumber-windows on # keep window numbers gap-free after closing one
setw -g allow-passthrough on # let programs pass escape sequences through (image previews…)
# One session per WezTerm tab, so the tab should be named after the session: tmux
# sets the terminal title, WezTerm shows it as the tab title. A manual Leader+,
# rename still wins (an explicit tab title beats the pane title). @icon is the
# same glyph table the status bar uses (set further down — formats resolve when
# they're drawn, not when they're read), so the tab says what the focused window
# is running: a glance at the tab bar reads "nvim here, yazi there".
set -g set-titles on
set -g set-titles-string "#{E:@icon} #S"
# Window names stay the running process (tmux's default) — naming them after the
# directory made every window echo the session name, since a session IS a project
# dir. Only fix the one useless case: claude's binary reports its version as the
# process name, so "2.1.220" → "claude".
setw -g automatic-rename-format "#{s|^[0-9][0-9.]*$|claude|:pane_current_command}"
# windows + panes already start at 1 (base-index/pane-base-index set in home/tmux.nix)

# ── panes & windows (additive — the default binds still work too) ────────────
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}" # \ = side-by-side split, no Shift (| still works)
bind - split-window -v -c "#{pane_current_path}"

# Prefix + hjkl selects panes; C-hjkl with no prefix also hops nvim↔tmux (navigator).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Prefix + HJKL resizes (repeatable: hold within the repeat window).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind C-l send-keys 'C-l' # navigator swallows the shell's C-l; prefix C-l still clears
# Reorder windows with prefix + < / > (keeps focus on the moved window).
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind Tab last-window # prefix Tab → previous window

# ── sessions ─────────────────────────────────────────────────────────────────
# Session picker: live sessions, windows+panes preview, ^X kills. The popup owns
# the frame (rounded, accent border, title) so fzf can run borderless inside it —
# one box, not a box in a box.
bind f display-popup -E -w 70% -h 75% -b rounded -S "fg=blue" -T "  sessions " "tmux-sessionizer"
bind s choose-tree -Zs # zoomed session/window tree

# ── copy mode (vi); system clipboard handled by tmux-yank (`y` / mouse-drag) ──
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# tmux draws a message at row 1 col 1 and then redraws the REST of the status
# line straight after it, so a short message collides with the window list
# ("tmux reloaded1  zsh"). Padding it past the client width makes it own the
# whole row for its display time instead — same #{pN:} trick as the rule. The
# #{l:} is load-bearing: #{pN:} resolves its argument as a FORMAT, so bare text
# silently expands to nothing and you get 500 blank columns.
bind r source-file ~/.config/tmux/tmux.conf \; display -d 900 "#{p500:#{l:   reloaded}}"

# ── status: theme-agnostic. The accent is the terminal's ANSI blue slot — the one
#    WezTerm's own chrome uses (#1e66f5 Latte / #89b4fa Mocha), so the two bars
#    match without tmux ever hearing about a flavour. It is used as FOREGROUND for
#    legibility; filled segments use `reverse`, so their text takes the terminal's
#    own background colour and stays readable in light AND dark. The session pill
#    fills solid the moment the prefix is held.
set -g status-position top # sits right under WezTerm's tab bar: one band of chrome, not one at each edge
set -g status-interval 5
# Row 1 is the rule, and it doubles as the gap: a ─ sits mid-cell, so there's
# half a row of air above and below it — the bar stops touching the first line of
# pane text. It is drawn as CHARACTERS on purpose. The obvious way, `underscore`
# in status-style, is not per-row: tmux fills every status row with status-style
# (verified on the wire — `#[nounderscore]`, `#[none]`, even `#[bg=red]` in
# status-format[1] change nothing, and tmux re-emits SGR 4 for the fill), so with
# two rows it drew two hairlines. That was the double line.
#
# Built without a shell: pad one space out to 500, then substitute every space
# for ─ — tmux's s/// replaces all occurrences, and the line is truncated to the
# client's width. Blank the format instead if you ever want plain space here.
set -g status 2
set -g status-format[1] "#[fg=colour8]#{s/ /─/:#{p500:#{l: }}}"
set -g status-style "fg=default,bg=default" # the separating rule is status-format[1], below
set -g status-justify left
# Per-window glyph, chosen from the running command by pure format substitution —
# no #() shell, so it costs nothing per redraw and can never hang the bar. Read it
# inside-out: the innermost rule is applied first and the OUTERMOST is the
# catch-all that turns anything still unmatched into a dot (the window name prints
# right after it, so nothing is lost). `^[0-9][0-9.]*$` is claude again — it
# reports its version as the process name, same case automatic-rename-format fixes.
# The replacements are literal Nerd Font glyphs: strip them and every rule quietly
# becomes s/x// — a no-op — which is exactly how they all went missing once.
set -g @icon "#{s/^[A-Za-z0-9._+-]+$//:#{s/^(btop|htop|top|glances)$//:#{s/^(ssh|mosh)$/󰌘/:#{s/^(docker|docker-compose|kubectl|k9s|terraform|tofu)$/󰆧/:#{s/^([Pp]ython3?|uv|ipython|pytest)$//:#{s/^(node|npm|pnpm|yarn|bun|deno)$//:#{s/^([0-9][0-9.]*|claude)$/󰚩/:#{s/^(yazi|ranger|lf|nnn)$//:#{s/^(lazygit|git|gh|tig)$//:#{s/^(zsh|bash|fish|sh)$//:#{s/^n?vim$//:pane_current_command}}}}}}}}}}}"
# NB: commas inside #[...] would be read as the #{?:} branch separators, so the
# style sits OUTSIDE the conditional and the conditional only toggles #[reverse].
# The prefix badge must not change WIDTH, only style: the branches used to be
# "  " vs "", so every press slid the window list three columns sideways
# (seen on the wire as the pad going \033[47X -> \033[44X). Both branches are
# one cell now, so holding the prefix lights the pill and moves nothing.
set -g status-left "#[fg=blue,bold]#{?client_prefix,#[reverse],} #{?client_prefix,,} #S #[default] "
set -g status-left-length 50
# status-right (CPU/RAM/disk) is set in home/tmux.nix, next to the cpu plugin, so
# the plugin can rewrite its #{...} placeholders before the main config loads.
setw -g window-status-current-format "#[fg=blue,reverse,bold] #I #{E:@icon} #W#{?window_zoomed_flag,  ,} #[noreverse]"
setw -g window-status-format "#[fg=default] #I #{E:@icon} #W "
setw -g window-status-separator ""
set -g pane-active-border-style "fg=blue"
set -g pane-border-style "fg=default"
set -g mode-style "fg=blue,reverse,bold"
set -g message-style "fg=blue,reverse,bold"
set -g display-time 1500
