add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$pulumi$line_break$character"
# AWS sits on the right of the input line: it's ambient state, not something you
# read before typing, and off the left it stops pushing the cursor around when a
# profile is exported. zsh redraws it as RPROMPT and hides it if a long command
# runs into it.
right_format = "$aws"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[aws]
format = '[$symbol$profile( \[$duration\])]($style)'
style = 'dimmed yellow'
symbol = ' '

[pulumi]
symbol = ' '
format = '[$symbol$stack]($style) '
